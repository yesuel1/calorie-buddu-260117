<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- TODO: Task 1.1.2 - HTML5 doctype 및 기본 구조 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- TODO: Task 1.1.2 - 메타태그 (viewport, charset, description) -->
    <meta name="description" content="CalorieBuddy - 운동하는 사람을 위한 칼로리 챗봇">
    
    <!-- TODO: Task 1.1.2 - Open Graph 메타태그 (소셜 공유용) -->
    <meta property="og:title" content="CalorieBuddy 💪">
    <meta property="og:description" content="음식 칼로리와 영양 정보를 쉽게 확인하세요">
    <meta property="og:type" content="website">
    
    <title>CalorieBuddy 💪</title>
    
    <!-- TODO: Task 1.1.2 - styles/main.css 파일 참조 -->
    <link rel="stylesheet" href="styles/main.css">
    <!-- TODO: Task 1.2.2 - styles/chat.css 파일 참조 -->
    <link rel="stylesheet" href="styles/chat.css">
    <!-- TODO: Task 1.2.3 - styles/card.css 파일 참조 -->
    <link rel="stylesheet" href="styles/card.css">
</head>
<body>
    <!-- TODO: Task 1.1.3 - 헤더 영역 (로고, 타이틀) -->
    <header class="app-header">
        <div class="header-content">
            <h1>CalorieBuddy 💪</h1>
        </div>
    </header>
    
    <!-- TODO: Task 1.1.3 - 대화창 영역 (스크롤 가능) -->
    <main class="app-main">
        <div class="chat-container" id="chatContainer">
            <!-- TODO: Task 1.2.2 - 대화창 레이아웃 (Flexbox) -->
            <div class="messages" id="messages" role="log" aria-live="polite" aria-label="채팅 메시지 목록">
                <!-- 메시지들이 동적으로 추가됩니다 -->
                
                <!-- TODO: Task 1.3.1 - 메시지 버블 템플릿 (bot/user 구분) -->
                <!-- 
                메시지 버블 템플릿 예시:
                <div class="message bot">
                    <div class="message-bubble">
                        <div class="message-content">봇 메시지 내용</div>
                    </div>
                </div>
                
                <div class="message user">
                    <div class="message-bubble">
                        <div class="message-content">사용자 메시지 내용</div>
                    </div>
                </div>
                -->
            </div>
        </div>
    </main>
    
    <!-- TODO: Task 1.1.3 - 입력 영역 (input + 사진 버튼) -->
    <footer class="app-footer">
        <div class="input-container">
            <!-- TODO: Task 1.2.2 - 입력창 하단 고정 스타일 -->
            <input
                type="text"
                id="user-input"
                class="message-input"
                placeholder="음식 이름을 입력하세요..."
                autocomplete="off"
                aria-label="음식 이름 입력"
            >
            <button
                type="button"
                id="send-btn"
                class="send-button"
                aria-label="메시지 전송"
            >
                전송
            </button>
            <button
                type="button"
                id="image-btn"
                class="photo-button"
                aria-label="사진 업로드"
            >
                📷
            </button>
            <!-- Week 2: 숨겨진 파일 입력 요소 -->
            <input
                type="file"
                id="image-input"
                class="hidden-file-input"
                accept="image/*"
                aria-label="이미지 파일 선택"
                style="display: none;"
            >
        </div>
    </footer>
    
    <!-- API Keys Configuration -->
    <!-- 로컬: config/api-keys.js (gitignore) -->
    <!-- 프로덕션: config/api-keys.prod.js (git 커밋) -->
    <script>
        // 환경 감지: localhost/127.0.0.1 = 로컬, 그 외 = 프로덕션
        const isProduction = !['localhost', '127.0.0.1'].some(host =>
            window.location.hostname.includes(host)
        );

        // 환경에 맞는 API 키 파일 로드
        const apiKeyScript = document.createElement('script');
        apiKeyScript.src = isProduction
            ? 'config/api-keys.prod.js'
            : 'config/api-keys.js';
        apiKeyScript.onerror = function() {
            console.warn('API 키 파일을 로드할 수 없습니다. Mock 모드로 동작합니다.');
            // API 키가 없어도 Mock 모드로 동작하도록 기본값 설정
            window.API_KEYS = window.API_KEYS || {
                foodSafety: 'YOUR_API_KEY_HERE',
                clarifai: 'YOUR_CLARIFAI_KEY_HERE',
                googleVision: 'YOUR_GOOGLE_VISION_API_KEY_HERE'
            };
        };
        document.head.appendChild(apiKeyScript);
    </script>

    <!-- TODO: Task 1.1.2 - scripts/app.js 파일 참조 -->
    <script src="scripts/chat.js"></script>
    <script src="scripts/search.js"></script>
    <script src="scripts/nutrition.js"></script>
    <script src="scripts/app.js"></script>
</body>
</html>
